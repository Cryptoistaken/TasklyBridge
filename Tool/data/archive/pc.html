<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PC — password change</title>
<style>
body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
label { display: block; margin: 12px 0; }
input, textarea { display: block; width: 100%; margin-top: 4px; padding: 8px; box-sizing: border-box; }
button { padding: 10px 28px; font-size: 16px; cursor: pointer; }
#status { color: #666; }
</style>
</head>
<body>
<h1>PC — password change</h1>
<label>Current password <input id="current" type="text" value="dgddigital"></label>
<label>New password <input id="new" type="text" placeholder="type new password"></label>
<label>Target URL <input id="target" type="text"></label>
<label>Cookie string <textarea id="cookie" rows="6" placeholder="paste cookie string here"></textarea></label>
<button id="run" onclick="window.__pcGo=true;document.getElementById('status').textContent='Running…'">Run</button>
<p id="status">Fill the boxes, then click Run. Keep this tab open.</p>
</body>
</html>
